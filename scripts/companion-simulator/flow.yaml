appId: com.github.arkadeleon.ragnarok-offline
---
- launchApp:
    clearState: true
- assertVisible: ".*AI-Knight-2.*"
- tapOn: ".*AI-Knight-2.*"
- tapOn: "Stop"
- assertVisible: ".*Stopped.*"
- tapOn: "Details"
- tapOn: "Skills"
- assertVisible: "Two-Hand Quicken"
- tapOn: "AI On"
- assertVisible: "AI Off"
- tapOn: "Gear"
- tapOn: "Two-Handed Sword"
- tapOn: "Unequip"
- assertVisible: "Equipment unequipped."
- tapOn: "Close AI-Knight-2"
- tapOn: "Reserve"
- tapOn: "Details"
- tapOn: "Your Bag"
- tapOn: "Bastard Sword"
- tapOn: "Give"
- assertVisible: "Equipment given."
- tapOn: "Supplies"
- tapOn: "Red Potion"
- tapOn: "Return"
- assertVisible: "Supply returned."
- tapOn: "Close AI-Knight-2"
- tapOn: "Settings"
- assertVisible: "Build"
- assertVisible: "Preset"
- assertVisible: "Speech"
- scrollUntilVisible:
    element: "Retreat at HP"
    direction: DOWN
- tapOn: "Close Companion Settings"
- tapOn: "Summon"
- tapOn: "Follow"
- assertVisible: ".*Following.*"
- tapOn: "Assist"
- tapOn: "Team · Assist ▾"
- tapOn: "Mob"
- tapOn: "Retreat"
- tapOn: "Team · Retreat ▾"
- tapOn: "Assist"
    # exact label also occurs in individual controls; the menu is modal
- tapOn: "Manage ▾"
- assertVisible: "Recruit"
