name: Ground effect pixels on iPhone Simulator
on: [push]
jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Test ground skill lifecycle, spell effects and hit labels
        working-directory: Packages/RagnarokGame
        run: |
          set -euxo pipefail
          sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer
          python3 ../../scripts/fetch-ground-reference.py
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if "iPhone" in d["name"]))')
          xcodebuild -scheme RagnarokGame -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO test
