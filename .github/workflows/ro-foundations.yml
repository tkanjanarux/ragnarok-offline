name: RO foundations iPhone build
on:
  push:
    branches: [main, ui-original-restore, ui-navigation-polish, ui-guild-original, gamepad-round1, gamepad-round1-controls, gamepad-directional-target, gamepad-range-loot, gamepad-x-loot]
    paths:
      - 'Packages/**'
      - 'RagnarokOffline/**'
      - 'RagnarokOffline.xcodeproj/**'
      - 'Configurations/**'
      - 'swift-rathena'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navigation-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Navigation lifecycle, geometry and panel hit regions
        run: |
          python3 scripts/test-navigation.py /tmp/navigation-tests
          docker run --rm --network none -v /tmp/navigation-tests:/work:ro -w /work swift:6.2 swift test --scratch-path /tmp/build
  guild-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Guild permissions, identity and foundation regressions
        run: |
          python3 scripts/test-ro-foundations.py /tmp/guild-tests
          docker run --rm --network none -v /tmp/guild-tests:/work:ro -w /work swift:6.2 swift test --scratch-path /tmp/build
  gamepad-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Controller input policy regressions
        run: |
          python3 scripts/test-gamepad.py /tmp/gamepad-tests
          python3 scripts/test-gamepad-combat.py /tmp/gamepad-tests
          docker run --rm --network none -v /tmp/gamepad-tests:/work:ro -w /work swift:6.2 swift test --scratch-path /tmp/build
  iphone:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select Xcode 27.2
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer
          xcodebuild -version
      - name: Build full unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild -project RagnarokOffline.xcodeproj -scheme RagnarokOffline -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log
      - name: Package for external signing
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/RagnarokOffline.app Payload/
          zip -qry RagOff-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: RagOff-unsigned
          path: RagOff-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
