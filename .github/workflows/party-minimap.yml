name: Party minimap iPhone build and tests
on:
  push:
    branches: [qa/party-minimap-20261124]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iphone:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select Xcode 27.2
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild -project RagnarokOffline.xcodeproj -scheme RagnarokOffline -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log
      - name: Package for external signing
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/RagnarokOffline.app Payload/
          zip -qry RagOff-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: RagOff-unsigned
          path: RagOff-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
  simulator:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Test party packets and minimap on iPhone Simulator
        working-directory: Packages/RagnarokGame
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if "iPhone" in d["name"]))')
          echo "$device" > ../../simulator-device.txt
          xcodebuild -scheme RagnarokGame -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO -only-testing:RagnarokGameTests/PartyMinimapTests -only-testing:RagnarokGameTests/PartyWorldBarTests -resultBundlePath ../../party-tests.xcresult test 2>&1 | tee ../../simulator.log
      - name: Extract test results
        if: always()
        run: |
          if test -d party-tests.xcresult; then
            xcrun xcresulttool get test-results summary --path party-tests.xcresult > simulator-summary.json
            xcrun xcresulttool get test-results tests --path party-tests.xcresult > simulator-tests.json
          fi
          mkdir -p visual-evidence
          if test -f simulator-device.txt; then
            device=$(cat simulator-device.txt)
            find "$HOME/Library/Developer/CoreSimulator/Devices/$device/data/Containers" -name 'party-bars-*.png' -exec cp {} visual-evidence/ \;
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: party-simulator-results
          path: |
            simulator.log
            simulator-summary.json
            simulator-tests.json
            party-tests.xcresult
            visual-evidence
