name: Navigation iPhone build and tests
on:
  push:
    branches: [qa/navigation-20261124]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iphone:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select Xcode 27.2
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild -project RagnarokOffline.xcodeproj -scheme RagnarokOffline -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log
      - name: Package for external signing
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/RagnarokOffline.app Payload/
          zip -qry RagOff-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: RagOff-unsigned
          path: RagOff-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
  simulator:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Test party packets and minimap on iPhone Simulator
        working-directory: Packages/RagnarokGame
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if "iPhone" in d["name"]))')
          echo "$device" > ../../simulator-device.txt
          xcodebuild -scheme RagnarokGame -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO -only-testing:RagnarokGameTests/PartyMinimapTests -only-testing:RagnarokGameTests/PartyWorldBarTests -only-testing:RagnarokGameTests/NavigationTests -resultBundlePath ../../party-tests.xcresult test 2>&1 | tee ../../simulator.log
      - name: Extract test results
        if: always()
        run: |
          if test -d party-tests.xcresult; then
            xcrun xcresulttool get test-results summary --path party-tests.xcresult > simulator-summary.json || true
            xcrun xcresulttool get test-results tests --path party-tests.xcresult > simulator-tests.json || true
          fi
          mkdir -p visual-evidence
          python3 - <<'PY'
          import base64, pathlib, re
          output = pathlib.Path('visual-evidence')
          log = pathlib.Path('simulator.log').read_text()
          for name, encoded in re.findall(r'PARTY_BAR_PNG ([\w-]+) ([A-Za-z0-9+/=]+)', log):
              data = base64.b64decode(encoded, validate=True)
              assert data.startswith(b'\x89PNG\r\n\x1a\n')
              (output / ('party-bars-' + name + '.png')).write_bytes(data)
          assert len(list(output.glob('party-bars-*.png'))) == 3, 'Missing simulator fixture images'
          for name, encoded in re.findall(r'NAVIGATION_PNG ([\w-]+) ([A-Za-z0-9+/=]+)', log):
              data = base64.b64decode(encoded, validate=True)
              assert data.startswith(b'\x89PNG\r\n\x1a\n')
              (output / ('navigation-' + name + '.png')).write_bytes(data)
          assert len(list(output.glob('navigation-*.png'))) == 3, 'Missing navigation fixture images'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: party-simulator-results
          path: |
            simulator.log
            simulator-summary.json
            simulator-tests.json
            party-tests.xcresult
            visual-evidence
