name: Companion simulator capture
on:
  push:
    branches: [qa/companion-window-simulator]
permissions:
  contents: read
jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        version: [before, after]
    runs-on: xcode-27
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Use original window code for baseline
        if: matrix.version == 'before'
        run: |
          git checkout b0e5b1b -- Packages/RagnarokGame/Sources/RagnarokGame/UI/{CompanionView,CompanionEquipmentView}.swift
      - name: Capture iPhone simulator
        run: |
          set -eu
          sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; phones=[d for ds in json.load(sys.stdin)["devices"].values() for d in ds if "iPhone" in d["name"]]; print(next((d for d in phones if "Duo" in d["name"]),phones[0])["udid"])')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -quiet -project RagnarokOffline.xcodeproj -scheme RagnarokOffline -configuration Debug -destination "id=$DEVICE" -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          APP=build/Build/Products/Debug-iphonesimulator/RagnarokOffline.app
          ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl install "$DEVICE" "$APP"
          mkdir captures
          xcrun simctl list devices booted > captures/device.txt
          for screen in roster gear; do
          for pose in portrait landscape; do
            xcrun simctl launch --terminate-running-process "$DEVICE" "$ID" "$pose" "$screen"
            sleep 6
            xcrun simctl io "$DEVICE" screenshot "captures/$screen-$pose.png"
          done
          done
          python3 -c 'import struct; size=lambda f:struct.unpack(">II",open("captures/"+f+".png","rb").read()[16:24]); p=size("roster-portrait"); l=size("roster-landscape"); assert p[0]<p[1] and l[0]>l[1],(p,l)'
      - name: Exercise revised controls
        if: matrix.version == 'after' 
        run: |
          set -eu
          curl -fsSL --retry 3 https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.12.1/maestro.zip -o /tmp/companion-maestro.zip
          echo '54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7  /tmp/companion-maestro.zip' | shasum -a 256 -c -
          unzip -q /tmp/companion-maestro.zip -d /tmp/companion-maestro
          DEVICE=$(xcrun simctl list devices booted -j | python3 -c 'import sys,json;print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if "iPhone" in d["name"] and d["state"]=="Booted"))')
          export JAVA_HOME=$(/usr/libexec/java_home -v 17)
          export MAESTRO_CLI_NO_ANALYTICS=1
          /tmp/companion-maestro/maestro/bin/maestro --device "$DEVICE" test --format junit --output captures/interactions.xml scripts/companion-simulator/flow.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-simulator-${{ matrix.version }}
          path: captures
